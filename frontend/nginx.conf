server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS, resolved at request time rather than at startup.
    #
    # nginx resolves a static proxy_pass hostname once, when it loads the config,
    # and keeps that address for the life of the process. Recreating a service
    # gives it a new IP, so after any `docker compose up -d --build` of a backend
    # the proxy keeps dialling an address that no longer exists and returns 502 —
    # while the backend itself is perfectly healthy. Using a variable forces a
    # lookup per request (honoured by the TTL below), which is what makes the
    # proxy survive a restart instead of needing one by hand.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Reverse-proxy the orchestrator so the browser only talks to one origin.
    # /api/chat -> POST http://orchestrator:8000/chat
    # A regex location rather than a prefix one, because the moment
    # proxy_pass contains a variable nginx stops replacing the matched prefix:
    # /api/chat would arrive at the backend as /api/chat and 404. Capturing the
    # remainder and passing it explicitly is what keeps /api/chat -> /chat.
    location ~ ^/api/(.*)$ {
        set $orchestrator_upstream http://orchestrator:8000;
        proxy_pass $orchestrator_upstream/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM intent classification can take a few seconds.
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every other path renders index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # GitGuardian flagged a committed OpenSearch password. That is a
    # self-hosted gate for the same class of finding: it fails on any secret in
    # the tree, not only on the ones a vendor has already catalogued.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the full history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ""
        with:
          args: detect --source . --redact --verbose

  backend:
    name: Backend lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.docker.txt

      # The container runtime deps plus the test/lint tooling. Installing from
      # requirements.txt instead would pull sentence-transformers and PyTorch
      # (~2GB) for a code path no test exercises.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.docker.txt
          pip install "pytest>=8.3.0" "pytest-asyncio>=0.24.0" "ruff>=0.6.0"

      - name: Ruff
        run: ruff check src/ evaluation/

      - name: Pytest
        run: pytest evaluation/ -q

      # Type checking is informational: numpy's bundled stubs do not currently
      # parse on 3.12, and this is tracked separately. Kept non-blocking rather
      # than removed so it starts reporting once that is fixed.
      - name: Mypy (non-blocking)
        continue-on-error: true
        run: |
          pip install "mypy>=1.11.0" || true
          mypy src/ || true

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  redteam:
    name: Red-team suite (live stack)
    runs-on: ubuntu-latest
    # The security assessment is only meaningful against the running system:
    # the harness calls the real orchestrator, booking and planner endpoints.
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Write .env
        run: |
          # Generated per run, never committed: a password in this workflow file
          # would be a credential in the repository and in its history.
          {
            echo "OPENSEARCH_INITIAL_ADMIN_PASSWORD=$(openssl rand -base64 18)"
            # Signs the HITL confirmation tokens. Required with no default, so the
            # booking agent would refuse to clear the gate without it.
            echo "HITL_TOKEN_SECRET=$(openssl rand -hex 24)"
            # The GROQ key is deliberately absent: the router and the parser both
            # have deterministic fallbacks, which is what the harness should be
            # exercising anyway.
            echo "LOG_LEVEL=WARNING"
            echo "DEBUG_MODE=False"
            # The agents run as this uid so they can write the bind-mounted audit
            # log. It has to be the runner's own uid, not a hardcoded 1000: the
            # workspace is owned by the runner, so a mismatch makes every
            # bind-mounted write fail. Hardcoding it broke the booking store
            # with "sqlite3.OperationalError: unable to open database file".
            echo "DOCKER_UID=$(id -u)"
            echo "DOCKER_GID=$(id -g)"
          } > .env

          # data/booking is git-ignored, so it does not exist in a fresh checkout
          # and Docker would create it root-owned, which the agents cannot write.
          mkdir -p data/booking

      - name: Build images
        run: docker compose build

      - name: Start the stack
        # DOCKER_UID/DOCKER_GID come from the generated .env, not from here.
        run: docker compose up -d

      - name: Wait for health
        run: |
          for i in $(seq 1 40); do
            healthy=$(docker compose ps --format '{{.Service}} {{.Health}}' \
              | awk '$2=="healthy"' | wc -l)
            if [ "$healthy" -ge 4 ]; then
              echo "stack healthy"; exit 0
            fi
            sleep 5
          done
          echo "stack did not become healthy"
          docker compose ps
          # Name the unhealthy services: "not healthy" alone sent us hunting
          # through 50 lines of unrelated OpenSearch startup noise.
          docker compose ps --format '{{.Service}} {{.State}} {{.Health}}' \
            | awk '$NF != "healthy" && $2 == "running"'
          docker compose logs --tail=80 booking orchestrator planner
          exit 1

      - name: Run the red-team suite
        env:
          RT_ORCHESTRATOR_URL: http://localhost:8100
          RT_BOOKING_URL: http://localhost:8102
          RT_PLANNER_URL: http://localhost:8101
        run: |
          python -m venv .venv-ci
          . .venv-ci/bin/activate
          pip install -r requirements.docker.txt
          python evaluation/redteam_prompt_injection.py --strict

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-evidence
          path: |
            evaluation/redteam_evidence.json
            evaluation/security_audit_log.jsonl

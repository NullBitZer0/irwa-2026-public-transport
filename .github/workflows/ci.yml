name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # GitGuardian flagged a committed OpenSearch password. That is a
    # self-hosted gate for the same class of finding: it fails on any secret in
    # the tree, not only on the ones a vendor has already catalogued.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the full history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ""
        with:
          args: detect --source . --redact --verbose

  backend:
    name: Backend lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.docker.txt

      # The container runtime deps plus the test/lint tooling. Installing from
      # requirements.txt instead would pull sentence-transformers and PyTorch
      # (~2GB) for a code path no test exercises.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.docker.txt
          pip install "pytest>=8.3.0" "pytest-asyncio>=0.24.0" "ruff>=0.6.0"

      - name: Ruff
        run: ruff check src/ evaluation/

      - name: Pytest
        run: pytest evaluation/ -q

      # Type checking is informational: numpy's bundled stubs do not currently
      # parse on 3.12, and this is tracked separately. Kept non-blocking rather
      # than removed so it starts reporting once that is fixed.
      - name: Mypy (non-blocking)
        continue-on-error: true
        run: |
          pip install "mypy>=1.11.0" || true
          mypy src/ || true

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Before the build: `vite build` passing does not mean the app renders.
      # A missing prop is a render-time TypeError, not a build error, so the UI
      # can be a blank page with every other check green.
      - name: Render check
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  retrieval-opensearch:
    name: Retrieval — OpenSearch backend
    runs-on: ubuntu-latest
    # The OpenSearch retrieval path was previously only verified on one machine.
    # This proves it on every push: real index, real BM25 search, and the mode
    # and direction invariants re-checked against results that came back through
    # the search engine rather than out of the fixtures.
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.docker.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.docker.txt
          pip install "pytest>=8.3.0" "pytest-asyncio>=0.24.0"

      - name: Write .env
        # Same script as the red-team job: compose interpolates the whole file,
        # so this job needs the same required variables even though it only
        # starts opensearch.
        run: .github/scripts/write-ci-env.sh

      - name: Start OpenSearch
        run: |
          docker compose up -d opensearch
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:9200 >/dev/null 2>&1; then
              echo "opensearch up"; exit 0
            fi
            sleep 5
          done
          echo "opensearch did not start"; docker compose logs --tail=50; exit 1

      - name: Index the corpus (BM25 only)
        # No sentence-transformers here: it pulls in PyTorch and the encoder is
        # deliberately absent from the image. This job proves the index, the
        # mapping and the BM25 search path; dense recall is verified locally, and
        # the mapping dimension is asserted by a unit test.
        run: python -m src.planner.opensearch_ingest --no-embeddings
        env:
          OPENSEARCH_URL: http://localhost:9200

      - name: Retrieval tests against the live index
        run: pytest evaluation/test_retrieval_backends.py -q
        env:
          OPENSEARCH_URL: http://localhost:9200
          RETRIEVER_BACKEND: opensearch

  redteam:
    name: Red-team suite (live stack)
    runs-on: ubuntu-latest
    # The security assessment is only meaningful against the running system:
    # the harness calls the real orchestrator, booking and planner endpoints.
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Write .env
        run: .github/scripts/write-ci-env.sh

      - name: Prepare bind-mount directories
        # data/booking is git-ignored, so it does not exist in a fresh checkout
        # and Docker would create it root-owned, which the agents cannot write.
        run: mkdir -p data/booking

      - name: Build images
        run: docker compose build

      - name: Start the stack
        # DOCKER_UID/DOCKER_GID come from the generated .env, not from here.
        run: docker compose up -d

      - name: Wait for health
        run: |
          # Count the services that actually define a healthcheck, rather than
          # hardcoding a number: a hardcoded threshold silently stops covering a
          # service when one is added, which is how an unhealthy agent can pass.
          # python3 rather than jq: it is guaranteed on the runner, and this is
          # not worth a step that can fail on a missing tool.
          expected=$(docker compose config --format json | python3 -c '
          import json, sys
          services = json.load(sys.stdin)["services"]
          print(sum(1 for s in services.values() if s.get("healthcheck")))
          ')
          echo "waiting for $expected healthchecked services"
          for i in $(seq 1 40); do
            healthy=$(docker compose ps --format '{{.Service}} {{.Health}}' \
              | awk '$2=="healthy"' | wc -l)
            if [ "$healthy" -ge "$expected" ]; then
              echo "stack healthy ($healthy/$expected)"
              exit 0
            fi
            sleep 5
          done
          echo "stack did not become healthy"
          docker compose ps
          # Name the unhealthy services: "not healthy" alone sent us hunting
          # through 50 lines of unrelated OpenSearch startup noise.
          docker compose ps --format '{{.Service}} {{.State}} {{.Health}}' \
            | awk '$NF != "healthy" && $2 == "running"'
          docker compose logs --tail=80 booking orchestrator planner conditions
          exit 1

      - name: Run the red-team suite
        env:
          RT_ORCHESTRATOR_URL: http://localhost:8100
          RT_BOOKING_URL: http://localhost:8102
          RT_PLANNER_URL: http://localhost:8101
        run: |
          python -m venv .venv-ci
          . .venv-ci/bin/activate
          pip install -r requirements.docker.txt
          python evaluation/redteam_prompt_injection.py --strict

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-evidence
          path: |
            evaluation/redteam_evidence.json
            evaluation/security_audit_log.jsonl

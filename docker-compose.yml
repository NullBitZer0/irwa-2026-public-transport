# LankaJourney AI — full stack
#
#   docker compose up --build
#
# Host ports are chosen to avoid clashing with other local services:
#   frontend    3000
#   orchestrator 8100
#   planner      8101
#   booking      8102
#   opensearch   9200
#
# Inside the compose network the agents talk to each other by service name.

name: lankajourney

x-agent: &agent
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  restart: unless-stopped
  # Run as the host user so the bind-mounted audit log stays writable.
  # Set DOCKER_UID / DOCKER_GID in .env to `id -u` / `id -g`.
  user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
  volumes:
    # Without this the agents write audit events to a container-local file that
    # is lost on `docker compose down`, so the security evidence never reaches
    # the repository.
    - ./evaluation:/app/evaluation

services:
  opensearch:
    image: opensearchproject/opensearch:2.17.0
    container_name: lankajourney-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      # No default value, on purpose. A password committed to the repository is
      # a leaked credential, and a shared "default" is exactly how that happens:
      # it gets copied, reused and published. This fails fast with instructions
      # instead, so the secret only ever lives in your untracked .env.
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?Set it in .env (see .env.example) or run: echo OPENSEARCH_INITIAL_ADMIN_PASSWORD=$(openssl rand -base64 18) >> .env}"
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  planner:
    <<: *agent
    container_name: lankajourney-planner
    build:
      context: .
      dockerfile: Dockerfile
      # Dense retrieval needs sentence-transformers (~2GB of PyTorch), which the
      # other agents never use. Opt the planner in so hybrid retrieval is real
      # rather than BM25-only. Drop this to `false` for a smaller, faster build.
      args:
        dense: "true"
    environment:
      # Retrieval backend: "fixtures" (default, deterministic, no infrastructure)
      # or "opensearch" for real BM25 + k-NN. See README for enabling the latter.
      - RETRIEVER_BACKEND=${RETRIEVER_BACKEND:-fixtures}
      - OPENSEARCH_URL=${OPENSEARCH_URL:-http://opensearch:9200}
      - OPENSEARCH_USER=${OPENSEARCH_USER:-admin}
      - OPENSEARCH_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-}
      - OPENSEARCH_INDEX=${OPENSEARCH_INDEX:-transit_routes}
      # The dense path downloads the sentence encoder on first use. The agents
      # run as the host user, whose HOME is `/` and is not writable, so the model
      # cache needs a path that is.
      - HF_HOME=/tmp/hf-cache
    command:
      - uvicorn
      - src.planner.server:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    ports:
      - "8101:8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  booking:
    <<: *agent
    container_name: lankajourney-booking
    command:
      - uvicorn
      - src.booking.server:app
      - --host
      - 0.0.0.0
      - --port
      - "8002"
    ports:
      - "8102:8002"
    environment:
      # Without this the booking store is in-memory and every held seat,
      # confirmed ticket and purchase-history entry is lost on restart.
      - BOOKING_DB_PATH=/app/state/booking.db
      # Signs the human-in-the-loop confirmation tokens (R-09). Required, with no
      # default: a shared signing key would let anyone forge an approval, which
      # is the exact failure the token exists to prevent. Generate one with
      # `echo HITL_TOKEN_SECRET=$(openssl rand -hex 24) >> .env`.
      - HITL_TOKEN_SECRET=${HITL_TOKEN_SECRET:?Set it in .env — see .env.example}
    volumes:
      # A service-level `volumes` list REPLACES the one inherited from the
      # *agent anchor, it does not merge — so the audit-log mount has to be
      # repeated here or the agents lose their evidence file.
      - ./evaluation:/app/evaluation
      # A bind mount rather than a named volume: Docker seeds a named volume
      # root-owned, which the non-root runtime user cannot write to.
      # A dedicated path, because mounting over /app/data would shadow the
      # timetable fixtures baked into the image.
      - ./data/booking:/app/state
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # One-shot: indexes the timetable corpus into OpenSearch with real embeddings.
  # Runs to completion and exits — not part of the long-running stack.
  #   docker compose --profile ingest run --rm ingest
  #
  # Needs sentence-transformers to embed the corpus, so it opts into the dense
  # build arg the same way the planner does. Without real embeddings the index
  # would hold `text` only and every k-NN query would fail, so this arg is not
  # optional here — the ingest either embeds or it is not an ingest.
  ingest:
    <<: *agent
    container_name: lankajourney-ingest
    profiles: ["ingest"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        dense: "true"
    command:
      - python
      - -m
      - src.planner.opensearch_ingest
    environment:
      - OPENSEARCH_URL=${OPENSEARCH_URL:-http://opensearch:9200}
      - OPENSEARCH_USER=${OPENSEARCH_USER:-admin}
      - OPENSEARCH_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-}
      - OPENSEARCH_INDEX=${OPENSEARCH_INDEX:-transit_routes}
      # See the planner: HOME is not writable for the runtime user, and the
      # encoder is downloaded rather than baked into the image.
      - HF_HOME=/tmp/hf-cache
    depends_on:
      - opensearch

  # Agent 5: current weather + live transit news, reduced to an advisory.
  # Egress is required here and only here; the three transactional agents make
  # no outbound calls of their own.
  conditions:
    <<: *agent
    container_name: lankajourney-conditions
    command:
      - uvicorn
      - src.conditions.server:app
      - --host
      - 0.0.0.0
      - --port
      - "8003"
    ports:
      - "8103:8003"
    environment:
      # Conditions are advisory only, and a feed outage must not slow planning.
      - CONDITIONS_TIMEOUT_SECONDS=6
      # Passed through rather than baked into the image: a weather API key in a
      # layer is a leaked key, and this file is committed. Empty is fine — the
      # agent falls back to Open-Meteo when it is unset.
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8003/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  orchestrator:
    <<: *agent
    container_name: lankajourney-orchestrator
    command:
      - uvicorn
      - src.orchestrator.server:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      # Service names resolve on the compose network; these override the
      # localhost URLs in .env, which only make sense on the host.
      PLANNER_AGENT_URL: http://planner:8001
      BOOKING_AGENT_URL: http://booking:8002
      CONDITIONS_AGENT_URL: http://conditions:8003
      # Conversation transcripts, so chat history survives a restart.
      CONVERSATIONS_DB_PATH: /app/state/conversations.db
      # Accounts live in the same mounted state directory as conversations,
      # under a different filename — a second volume at /app/state would shadow
      # the first rather than merge with it.
      ACCOUNTS_DB_PATH: /app/state/accounts.db
      AGENT_TIMEOUT_SECONDS: "20"
    ports:
      - "8100:8000"
    volumes:
      # A service-level `volumes` list REPLACES the one inherited from the
      # *agent anchor, it does not merge — so the audit-log mount is repeated.
      - ./evaluation:/app/evaluation
      - ./data/conversations:/app/state
    depends_on:
      - planner
      - booking
      - conditions
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lankajourney-frontend
    ports:
      - "3000:80"
    depends_on:
      - orchestrator
    restart: unless-stopped

volumes:
  opensearch-data:
  booking-data: